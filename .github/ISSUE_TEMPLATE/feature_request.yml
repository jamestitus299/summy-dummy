name: Feature request
description: Suggest an improvement or new capability
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement. Please describe the problem first so the proposed change is easier to evaluate.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem would this solve?
      placeholder: I want to...
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should change?
      placeholder: Add support for...
    validations:
      required: true

  # - type: dropdown
  #   id: area
  #   attributes:
  #     label: Area
  #     options:
  #       - ReactCanvas
  #       - CheckReactCode
  #       - EditTextReactCanvas
  #       - Scope/dependencies
  #       - Build/package output
  #       - Documentation
  #       - Developer experience
  #       - Other
  #   validations:
  #     required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What other approaches or workarounds have you tried?

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add screenshots, examples, links, or implementation notes.

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues before opening this one.
          required: true
        - label: This request fits the scope of react-code-canvas.
          required: true
