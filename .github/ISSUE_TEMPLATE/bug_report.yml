name: Bug report
description: Report a reproducible problem in react-code-canvas
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please include enough detail for maintainers to reproduce the issue.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened?
      placeholder: Describe the bug and what you expected to happen instead.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide a minimal code sample, repository, sandbox, or step-by-step instructions.
      placeholder: |
        1. Render ...
        2. Pass this code ...
        3. See error ...
    validations:
      required: true

  - type: input
    id: package-version
    attributes:
      label: Package version
      placeholder: "0.0.1"
    validations:
      required: true

  - type: input
    id: react-version
    attributes:
      label: React version
      placeholder: "18.3.1"
    validations:
      required: true

  # - type: dropdown
  #   id: component
  #   attributes:
  #     label: Affected API
  #     options:
  #       - ReactCanvas
  #       - CheckReactCode
  #       - EditTextReactCanvas
  #       - Scope/dependencies
  #       - Build/package output
  #       - Documentation
  #       - Other
  #   validations:
  #     required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser, OS, Bun or Node version, bundler/framework, and any relevant dependency versions.
      placeholder: |
        Browser:
        OS:
        Bun/Node:
        Bundler/framework:
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Paste relevant errors, stack traces, or screenshots.
      render: shell

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues before opening this one.
          required: true
        - label: I provided a minimal reproduction or clear steps to reproduce.
          required: true
