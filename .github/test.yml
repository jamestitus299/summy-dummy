name: Test Suite

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x] # Testing across LTS versions

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm' # Automatically caches node_modules based on package-lock.json

      - name: Install Dependencies
        run: npm ci # 'ci' is faster and more reliable than 'install' for CI environments

      - name: Run Jest Tests
        run: npm test

      - name: Build Check
        run: npm run build # Ensures that recent changes didn't break the Rollup compilation